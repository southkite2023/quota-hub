name: Publish personal-download APKs once
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/publish-personal-download-once.yml']
permissions:
  contents: read
concurrency:
  group: quota-hub-publish-0.7.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'southkite2023/quota-hub' && github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/android-release-size'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: southkite2023/quota-hub
      SOURCE_SHA: aea507ed01ea438315d49dae432fab1e46071a00
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30d94ff10906d9af4c9498df035687bbb4ae37f2
          persist-credentials: false
      - name: Verify draft, tested source and APKs
        run: |
          set -euo pipefail
          for run in 36682873452 36682873514; do
            gh api "repos/$GH_REPO/actions/runs/$run" > run.json
            jq -e --arg sha "$SOURCE_SHA" '.conclusion == "success" and .head_sha == $sha' run.json
          done
          gh api repos/$GH_REPO/actions/runs/36685735220 > smoke.json
          jq -e '.conclusion == "success" and .head_sha == "ed7d8792fa1fd4caec26124a48d125caa29471d1"' smoke.json
          gh api repos/$GH_REPO/releases/399821790 > draft.json
          jq -e --arg sha "$SOURCE_SHA" '.draft == true and .tag_name == "v0.7.1" and .target_commitish == $sha and (.assets | length) == 6' draft.json
          mkdir android-release
          gh release download v0.7.1 --dir android-release
          (cd android-release && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = json.loads(Path('docs/reports/0.7.1-apk-size.json').read_text())
          for apk in expected['apks']:
              path = Path('android-release') / apk['file']
              assert path.stat().st_size == apk['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == apk['sha256']
          PY
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for apk in android-release/*.apk; do
            "$tools/apksigner" verify --verbose --print-certs "$apk" > certificate.txt
            actual=$(sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' certificate.txt | tr '[:upper:]' '[:lower:]' | tr -d '\r' | sort -u)
            expected=$(tr -d '\r\n' < docs/ANDROID_SIGNING_SHA256.txt)
            test "$actual" = "$expected"
          done
          python3 scripts/inspect-android-apks.py --directory android-release --aapt "$tools/aapt" --zipalign "$tools/zipalign" --version 0.7.1 --build-number 9
      - name: Publish existing verified assets
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## 0.7.1 精简测试版 · 个人网页下载

          通过个人网页提供下载入口，安装包托管于 GitHub Releases；本版本不向国内应用商店提交。

          从 Debug 通用包改为 Release AOT，分离调试信息，保留原功能、包名和固定签名。相比 0.7.0 的 150.87 MB，通用包缩小至 48.80 MB，ARM64 包缩小至 17.02 MB（减少 88.7%）。

          | 安装包 | 大小 | 适用设备 |
          |---|---:|---|
          | arm64-v8a | 17.02 MB | 64 位 ARM 安卓手机 |
          | universal | 48.80 MB | 不确定架构时选择 |
          | armeabi-v7a | 14.25 MB | 仅支持 32 位 ARM 的旧设备 |
          | x86_64 | 18.46 MB | 对应架构设备/模拟器 |

          所有包均为 0.7.1+9；与 0.5.0/0.6.0/0.7.0 使用相同固定证书。更新时优先覆盖安装；卸载会删除本机账户配置。SHA256SUMS.txt 和 apk-report.json 提供哈希与精确大小。

          验证：86 项 Flutter 测试、静态检查及各平台构建；固定签名、版本、非调试标记、AOT、ABI 和 ZIP/64 位 ELF 的 16 KB 对齐通过。Android 15 x86_64 模拟器全新安装启动、从 0.7.0 无账户状态覆盖启动通过。

          本包仍为测试版。真实账户迁移、ARM 真机、小组件、长期后台刷新及 16 KB 设备运行仍待验收。Release 编译模式与 Latest 下载入口不代表正式质量验收。节点订阅仅支持自定义余额接口；AI 分类不代表会员/Coding 套餐查询，OpenAI 显示费用而非可用余额。

          源码：aea507ed01ea438315d49dae432fab1e46071a00。
          [构建记录](https://github.com/southkite2023/quota-hub/actions/runs/36682873452) · [测试记录](https://github.com/southkite2023/quota-hub/actions/runs/36682873514) · [安装启动检查](https://github.com/southkite2023/quota-hub/actions/runs/36685735220)。
          NOTES
          gh release edit v0.7.1 --title '0.7.1 精简测试版 · 个人网页下载' --notes-file notes.md --draft=false --latest
          gh release view v0.7.1 --json url,isDraft,assets > published.json
          jq -e '.isDraft == false and (.assets | length) == 6' published.json
          gh api repos/$GH_REPO/releases/latest --jq .tag_name | grep -qx v0.7.1
          gh api repos/$GH_REPO/git/ref/tags/v0.7.1 --jq .object.sha | grep -qx "$SOURCE_SHA"
