name: Publish macOS 1.1.0 preview (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-macos-1.1.0-once.yml

permissions:
  contents: write

concurrency:
  group: astracct-v1.1.0-macos-preview
  cancel-in-progress: false

jobs:
  macos:
    if: github.repository == 'southkite2023/quota-hub' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Enforce release source version and avoid replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -qx 'version: 1.1.0+15' apps/client/pubspec.yaml
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'v1.1.0 already exists; refuse to overwrite its assets'
            exit 1
          fi

      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Dart sources, tests and compile macOS bundle
        working-directory: apps/client
        run: |
          set -euo pipefail
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --no-pub .
          python3 ../../scripts/configure-desktop-runners.py
          git restore --source=HEAD -- pubspec.lock
          flutter pub get --enforce-lockfile
          flutter analyze lib test
          flutter test
          flutter build macos --release

      - name: Inspect and package the production app before smoke tests
        run: |
          set -euo pipefail
          app=apps/client/build/macos/Build/Products/Release/Astracct.app
          test -d "$app/Contents"
          test -e "$app/Contents/MacOS/Astracct"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")
          test "$bundle_id" = 'com.yuashie.astracct'
          test "$version" = '1.1.0'
          test "$build" = '15'
          lipo -archs "$app/Contents/MacOS/Astracct" | tee /tmp/astracct-arches
          grep -q x86_64 /tmp/astracct-arches
          grep -q arm64 /tmp/astracct-arches
          mkdir -p macos-release
          ditto -c -k --sequesterRsrc --keepParent "$app" macos-release/astracct-1.1.0-macos-universal.zip
          (cd macos-release && shasum -a 256 astracct-1.1.0-macos-universal.zip > SHA256SUMS.txt)
          unzip -t macos-release/astracct-1.1.0-macos-universal.zip > /dev/null
          echo 'Packaged production app; separate smoke runner will not replace it.'

      - name: Native macOS window and Keychain smoke checks
        working-directory: apps/client
        run: |
          set -euo pipefail
          flutter build macos --release --target=test/desktop_native_smoke.dart
          python3 - <<'PYSMOKE'
          import subprocess
          subprocess.run(
            ['build/macos/Build/Products/Release/Astracct.app/Contents/MacOS/Astracct'],
            check=True, timeout=90,
          )
          PYSMOKE

      - name: Publish tagged macOS-only prerelease with permanent downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.0 \
            macos-release/astracct-1.1.0-macos-universal.zip \
            macos-release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title '星账 Astracct 1.1.0 · macOS 节点订阅测试版' \
            --notes-file docs/releases/1.1.0-macos.md \
            --prerelease
          gh release view v1.1.0 --json tagName,isPrerelease,assets,htmlUrl

      - name: Keep build archive available for auditing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astracct-1.1.0-macos-preview
          path: macos-release/
          if-no-files-found: ignore
          retention-days: 14
