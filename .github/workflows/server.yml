name: DeepSeek snapshot adapter
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: packages/contracts
      - run: npm test
        working-directory: apps/server
