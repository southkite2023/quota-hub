name: Publish verified Astracct 0.10.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-010.yml, scripts/publish-010.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-astracct-010
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: southkite2023/quota-hub
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable build artifacts and prepare packages
        run: python3 scripts/publish-010.py
      - name: Create draft, attach verified packages, then publish
        run: |
          set -euo pipefail
          if gh release view v0.10.0 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace public packages.'
            exit 1
          fi
          gh release create v0.10.0 --target 36120a8745a2f52235c9b5b0c7fe5c34a9785154 --draft --title '0.10.0 · Astracct macOS 菜单栏测试版' --notes-file docs/releases/0.10.0.md
          gh release upload v0.10.0 release/*
          gh release edit v0.10.0 --draft=false --latest
