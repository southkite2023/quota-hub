name: Publish verified Astracct Android 1.0.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-100.yml, scripts/publish-100.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-astracct-100
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: southkite2023/quota-hub
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable signed APKs and prepare release files
        run: python3 scripts/publish-100.py
      - name: Create draft, attach verified APKs, then publish
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace packages.'
            exit 1
          fi
          gh release create v1.0.0 --target 1cbe0df37a191be8dbed935dc40f0464710549a5 --draft --title '1.0.0 · Astracct Android UI 测试版' --notes-file docs/releases/1.0.0.md
          gh release upload v1.0.0 release/*
          gh release edit v1.0.0 --draft=false --latest
