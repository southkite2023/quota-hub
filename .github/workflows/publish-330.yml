name: Verify and publish Astracct 3.3.0 testing release
on:
  workflow_run:
    workflows: [Flutter native build checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-astracct-330
  cancel-in-progress: false
jobs:
  windows-update:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - run: python scripts/prepare-330.py --only windows
      - shell: pwsh
        run: ./scripts/test-update-windows.ps1 -CandidateZip "$PWD/release/astracct-3.3.0-windows-x64.zip" -Installer "$PWD/apps/client/assets/updater/install.ps1"
  macos-update:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - run: python3 scripts/prepare-330.py --only macos
      - run: python3 scripts/test-update-macos.py release/astracct-3.3.0-macos-universal.zip apps/client/assets/updater/install.sh
      - name: Validate compressed DMG, layout and Applications shortcut
        run: |
          hdiutil verify release/astracct-3.3.0-macos-universal.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/astracct-dmg" release/astracct-3.3.0-macos-universal.dmg
          test "$(readlink "$RUNNER_TEMP/astracct-dmg/Applications")" = /Applications
          test -f "$RUNNER_TEMP/astracct-dmg/.DS_Store"
          test -f "$RUNNER_TEMP/astracct-dmg/.background/install.png"
          cmp "$RUNNER_TEMP/astracct-dmg/Astracct.app/Contents/Info.plist" <(unzip -p release/astracct-3.3.0-macos-universal.zip Astracct.app/Contents/Info.plist)
          hdiutil detach "$RUNNER_TEMP/astracct-dmg"
  publish:
    needs: [windows-update, macos-update]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: southkite2023/quota-hub
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Revalidate exact artifacts, Android version and fixed signing certificate
        run: python3 scripts/prepare-330.py
      - name: Create draft, attach verified packages, then publish
        run: |
          set -euo pipefail
          if gh release view v3.3.0 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace packages.'
            exit 1
          fi
          gh release create v3.3.0 --target "$SOURCE_SHA" --draft --title '3.3.0 · Astracct 账号跨端自动同步测试版' --notes-file docs/releases/3.3.0.md
          gh release upload v3.3.0 release/*
          gh release edit v3.3.0 --draft=false --latest
          gh release view v3.3.0 --json url,isDraft,isPrerelease,assets
