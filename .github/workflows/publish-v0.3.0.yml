name: Publish verified Android 0.3.0
on:
  pull_request:
    types: [synchronize]
    paths: [.github/workflows/publish-v0.3.0.yml]
permissions: {}
concurrency:
  group: publish-android-v0.3.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'southkite2023/quota-hub' && github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/cloud-balances'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: southkite2023/quota-hub
      SOURCE_SHA: 3f40723ef07060a363a7b34535f899239522b440
    steps:
      # One-time publication of the already-tested artifact; no PR code is executed.
      - name: Verify source and download exact tested APK
        shell: bash
        run: |
          set -euo pipefail
          for run in 36052195648 36052195661; do
            gh api "repos/$GH_REPO/actions/runs/$run" > run.json
            jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          done
          gh api "repos/$GH_REPO/actions/artifacts/10831186221" > artifact.json
          jq -e --arg sha "$SOURCE_SHA" '.expired == false and .name == "quota-hub-android-debug" and .workflow_run.head_sha == $sha' artifact.json
          gh api "repos/$GH_REPO/actions/artifacts/10831186221/zip" > artifact.zip
          echo '19cd8b8db5f684fb460b707d5cf1cb6aa8dd718318a489887df9b63d98513201  artifact.zip' | sha256sum --check
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifact.zip') as z:
              names = [n for n in z.namelist() if n.endswith('.apk')]
              assert names == ['app-debug.apk'], names
              with open('quota-hub-0.3.0-android.apk', 'wb') as f:
                  f.write(z.read(names[0]))
          PY
          aapt_path=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt_path" dump badging quota-hub-0.3.0-android.apk > apk-info.txt
          grep -E "^package: name='com.example.quota_hub'.*versionCode='4'.*versionName='0.3.0'" apk-info.txt
          sha256sum quota-hub-0.3.0-android.apk > SHA256SUMS.txt
      - name: Publish APK and release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          在下方 Assets 中点击 **quota-hub-0.3.0-android.apk** 即可下载安装。

          ## 更新内容
          - 新增阿里云中国站账户：可用额度、现金余额。
          - 新增腾讯云中国站账户：可用余额、现金及赠送余额。
          - 云账户支持多账户管理、本机加密保存、独立刷新及桌面组件。
          - 保留 DeepSeek、OpenRouter、OneAPI 兼容接口和自定义余额接口。

          ## 版本与验证
          - 版本：0.3.0，内部构建号 4。本次将已验证安装包放入 Releases，未重新打包或修改版本。
          - 42 项 Flutter 测试、代码检查及 Android 构建通过。
          - 此 APK 是 **Debug 测试构建**，尚未完成真实云账户及 Android 真机验收。
          - 云平台目前仅支持阿里云、腾讯云中国站长期子账户密钥；不支持临时 STS 凭据、国际站、华为云、AWS、Azure。
          - GitHub 的 Latest 标记用于指向最新下载版本，不代表已完成正式版验收。

          源码提交：`3f40723ef07060a363a7b34535f899239522b440`
          [构建记录](https://github.com/southkite2023/quota-hub/actions/runs/36052195648) · [测试记录](https://github.com/southkite2023/quota-hub/actions/runs/36052195661)
          NOTES
          if gh release view v0.3.0 --json isDraft > existing.json 2>/dev/null; then
            jq -e '.isDraft == true' existing.json
          else
            gh release create v0.3.0 --target "$SOURCE_SHA" --title 'Quota Hub 0.3.0（测试版）' --notes-file notes.md --draft
          fi
          gh release upload v0.3.0 quota-hub-0.3.0-android.apk SHA256SUMS.txt --clobber
          gh release edit v0.3.0 --notes-file notes.md --draft=false --latest
          gh release view v0.3.0 --json url,assets
