name: Publish verified Astracct 0.9.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-090.yml, scripts/publish-090.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-astracct-090
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: southkite2023/quota-hub
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable build artifacts and prepare packages
        run: python3 scripts/publish-090.py
      - name: Create draft, attach verified packages, then publish
        run: |
          set -euo pipefail
          if gh release view v0.9.0 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace public packages.'
            exit 1
          fi
          gh release create v0.9.0 --target 1843ef382cb3a616443c54421618fbdb03707f1a --draft --title '0.9.0 · Astracct 多平台测试版' --notes-file docs/releases/0.9.0.md
          gh release upload v0.9.0 release/*
          gh release edit v0.9.0 --draft=false --latest
