name: Publish verified Android 0.4.0
on:
  pull_request:
    types: [synchronize]
    paths: [.github/workflows/publish-v0.4.0.yml]
permissions: {}
concurrency:
  group: publish-android-v0.4.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'southkite2023/quota-hub' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/automatic-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: southkite2023/quota-hub
      SOURCE_SHA: b5b52f83b2cfef04c99a72e5b132fde475f572a9
    steps:
      # One-time publication of the already-tested artifact; no PR code is executed.
      - name: Verify source and download exact tested APK
        shell: bash
        run: |
          set -euo pipefail
          for run in 36397284226 36397284298; do
            gh api "repos/$GH_REPO/actions/runs/$run" > run.json
            jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          done
          gh api "repos/$GH_REPO/actions/artifacts/10958741776" > artifact.json
          jq -e --arg sha "$SOURCE_SHA" '.expired == false and .name == "quota-hub-android-debug" and .workflow_run.head_sha == $sha' artifact.json
          gh api "repos/$GH_REPO/actions/artifacts/10958741776/zip" > artifact.zip
          echo '60288934f32eda886494b3ae6247fcae8389eeda8effd93a2c1f462f8894eefb  artifact.zip' | sha256sum --check
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifact.zip') as z:
              names = [n for n in z.namelist() if n.endswith('.apk')]
              assert names == ['app-debug.apk'], names
              with open('quota-hub-0.4.0-android.apk', 'wb') as f:
                  f.write(z.read(names[0]))
          PY
          aapt_path=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt_path" dump badging quota-hub-0.4.0-android.apk > apk-info.txt
          grep -E "^package: name='com.example.quota_hub'.*versionCode='5'.*versionName='0.4.0'" apk-info.txt
          sha256sum quota-hub-0.4.0-android.apk > SHA256SUMS.txt
          gh release download v0.3.0 --pattern 'quota-hub-0.3.0-android.apk'
          signer="$(dirname "$aapt_path")/apksigner"
          "$signer" verify --print-certs quota-hub-0.3.0-android.apk | grep 'certificate SHA-256 digest:' > old-cert.txt
          "$signer" verify --print-certs quota-hub-0.4.0-android.apk | grep 'certificate SHA-256 digest:' > new-cert.txt
          if ! cmp -s old-cert.txt new-cert.txt; then touch signature-changed; fi
      - name: Publish APK and release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          在下方 Assets 点击 **quota-hub-0.4.0-android.apk** 下载安装。

          ## 自动刷新
          - 默认前台每 5 分钟主动获取全部账户余额，无需手动刷新。
          - 支持每 1、5、15、30、60 分钟，自定义 1–1440 分钟或关闭；设置保存在本机。
          - 在“管理 / 添加余额账户 → 自动刷新”设置间隔；开启“后台继续刷新”并允许通知，即可通过常驻通知在后台继续尝试刷新。
          - 通知中可停止后台刷新，设置中可重新开启；后台同时更新桌面组件。
          - 请求不重叠，返回前台只补一次到期查询；失败保留旧余额并标记过期。

          ## 版本与验证
          - 版本 0.4.0，构建号 5；49 项 Flutter 测试、静态检查、Web 和 Android 构建通过。
          - 本包是 Debug 测试构建，尚未进行 Android 真机、长时间锁屏及耗电验收。
          - 后台刷新尽力按间隔执行，受省电、断网、厂商限制影响，不保证精确定时。
          - Android 15 及以上数据同步服务有约 6 小时/24 小时后台运行限制，到时停止并提示重新开启；强制停止或重启设备后需要打开应用。
          - Latest 表示最新下载版本，不代表完成正式版验收。

          源码：`b5b52f83b2cfef04c99a72e5b132fde475f572a9`
          [构建记录](https://github.com/southkite2023/quota-hub/actions/runs/36397284226) · [测试记录](https://github.com/southkite2023/quota-hub/actions/runs/36397284298)
          NOTES
          if [ -f signature-changed ]; then
            cat >> notes.md <<'UPGRADE'

          ## 从 0.3.0 升级
          这两个测试包的调试签名不同，无法直接覆盖安装。请先确保自己保留了账户配置和密钥，再自行卸载旧版、安装新版并重新配置。卸载会删除本机加密账户数据，请勿在未保留凭据时卸载。
          UPGRADE
          fi
          if gh release view v0.4.0 --json isDraft > existing.json 2>/dev/null; then
            jq -e '.isDraft == true' existing.json
          else
            gh release create v0.4.0 --target "$SOURCE_SHA" --title 'Quota Hub 0.4.0（测试版）' --notes-file notes.md --draft
          fi
          gh release upload v0.4.0 quota-hub-0.4.0-android.apk SHA256SUMS.txt --clobber
          gh release edit v0.4.0 --notes-file notes.md --draft=false --latest
          gh release view v0.4.0 --json url,assets
