name: Linux packages
on:
  push:
    branches: [feat/linux-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev libjsoncpp-dev rpm squashfs-tools desktop-file-utils xvfb dbus-x11 gnome-keyring
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Generate Linux runner and build
        working-directory: apps/client
        run: |
          flutter create --platforms=linux --project-name=quota_hub --no-pub .
          sed -i 's/set(BINARY_NAME "quota_hub")/set(BINARY_NAME "astracct")/; s/com.example.quota_hub/com.yuashie.astracct/' linux/CMakeLists.txt
          rm -f analysis_options.yaml # flutter create adds a lint dependency absent from this project
          git restore -- pubspec.lock
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build linux --release
      - name: Check runtime dependencies and launch
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bundle="$PWD/apps/client/build/linux/$ARCH/release/bundle"
          file "$bundle/astracct"
          ldd "$bundle/astracct" | tee dependencies.txt
          ! grep -q 'not found' dependencies.txt
          set +e
          timeout 20s dbus-run-session -- xvfb-run -a "$bundle/astracct" >launch.log 2>&1
          code=$?
          set -e
          cat launch.log
          test "$code" = 124
          ! grep -Ei 'Unhandled Exception|error while loading shared libraries|Segmentation fault' launch.log
      - name: Package all formats
        run: python3 scripts/linux/package.py
      - name: Validate packages
        run: |
          for f in linux-dist/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done
          for f in linux-dist/*.rpm; do rpm -qpi "$f"; rpm -qpR "$f"; done
          for f in linux-dist/*.tar.gz; do tar -tzf "$f" | grep 'lib/libflutter_linux_gtk.so'; done
          for f in linux-dist/*.AppImage; do "$f" --appimage-extract >/dev/null; test -x squashfs-root/AppRun; done
          cd linux-dist
          sha256sum -c SHA256SUMS-*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            linux-dist/*
            launch.log
            dependencies.txt
          if-no-files-found: error
