name: Linux packages
on:
  push:
    branches: [feat/linux-release, main]
    paths: ['apps/client/**', 'scripts/linux/**', '.github/workflows/linux-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev libjsoncpp-dev rpm squashfs-tools desktop-file-utils xvfb dbus-x11 gnome-keyring rpm2cpio cpio openbox xdotool imagemagick
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Generate Linux runner and build
        working-directory: apps/client
        run: |
          flutter create --platforms=linux --project-name=quota_hub --no-pub .
          sed -i 's/set(BINARY_NAME "quota_hub")/set(BINARY_NAME "astracct")/; s/com.example.quota_hub/com.yuashie.astracct/' linux/CMakeLists.txt
          rm -f analysis_options.yaml # flutter create adds a lint dependency absent from this project
          git restore -- pubspec.lock
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build linux --release
      - name: Check runtime dependencies and launch
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bundle="$PWD/apps/client/build/linux/$ARCH/release/bundle"
          file "$bundle/astracct"
          ldd "$bundle/astracct" | tee dependencies.txt
          ! grep -q 'not found' dependencies.txt
          set +e
          timeout 20s dbus-run-session -- xvfb-run -a "$bundle/astracct" >launch.log 2>&1
          code=$?
          set -e
          cat launch.log
          test "$code" = 124
          ! grep -Ei 'Unhandled Exception|error while loading shared libraries|Segmentation fault' launch.log
      - name: Package all formats
        run: python3 scripts/linux/package.py
      - name: Validate packages
        run: |
          for f in linux-dist/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done
          for f in linux-dist/*.rpm; do rpm -qpi "$f"; rpm -qpR "$f"; done
          for f in linux-dist/*.tar.gz; do tar -tzf "$f" | grep 'lib/libflutter_linux_gtk.so'; done
          for f in linux-dist/*.AppImage; do "$f" --appimage-extract >/dev/null; test -x squashfs-root/AppRun; done
          cd linux-dist
          sha256sum -c SHA256SUMS-*.txt
      - name: Verify packaged payloads and visible windows
        run: bash scripts/linux/verify-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            linux-dist/Astracct-*
            linux-dist/SHA256SUMS-*
            linux-dist/packages-*
            linux-dist/*launch.png
            linux-dist/*launch.log
            launch.log
            dependencies.txt
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          pattern: linux-*
          path: candidates
      - name: Verify immutable build source and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: southkite2023/quota-hub
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/${{ github.run_id }} --jq .head_sha)" = ${{ github.sha }}
          mkdir release
          cp candidates/linux-*/linux-dist/Astracct-* candidates/linux-*/linux-dist/SHA256SUMS-* candidates/linux-*/linux-dist/packages-* release/
          cd release
          sha256sum -c SHA256SUMS-x86_64.txt
          sha256sum -c SHA256SUMS-aarch64.txt
          test "$(find . -name 'Astracct-Linux-*' | wc -l)" = 8
          cat SHA256SUMS-x86_64.txt SHA256SUMS-aarch64.txt > SHA256SUMS.txt
          python3 -c 'import json,pathlib; p=list(pathlib.Path(".").glob("packages-*.json")); d=sum([json.loads(x.read_text()) for x in p],[]); assert len(d)==8; pathlib.Path("linux-packages.json").write_text(json.dumps(d,indent=2))'
          cat > notes.md <<'EOF'
          星账 Astracct 3.4.0+24 Linux 公开测试版。

          新增 Linux 桌面窗口、托盘与开机启动。提供 x86_64 / ARM64 的 DEB、RPM、AppImage、tar.gz 八个包。其他平台继续使用 3.3.0。

          两种原生架构均通过静态检查、客户端测试、构建、依赖检查与启动验证；四种包中可执行文件一致。独立验证已检查解压包和 AppImage 中的可见窗口。构建来源：${{ github.run_id }}，源码 ${{ github.sha }}。

          系统要求：glibc 2.39+、GTK 3、libsecret、Ayatana AppIndicator、可用且已解锁的 Secret Service 密钥环。基线为 Ubuntu 24.04；其他发行版、真实账户与长期运行尚待验收。AppImage 不内置全部系统图形库，可使用 --appimage-extract-and-run 避免 FUSE 依赖。Linux 暂不支持系统身份解锁与自动安装更新，升级请手动安装并保留用户数据。桌面托盘依赖桌面环境支持。

          DEB：sudo apt install ./包名.deb；RPM：sudo dnf install ./包名.rpm；tar.gz：完整解压后运行 ./astracct；AppImage：赋予执行权限后运行。SHA256SUMS.txt 提供全部安装包校验值。
          EOF
          gh release create v3.4.0 --target ${{ github.sha }} --title 'Astracct 3.4.0 Linux 公开测试版' --notes-file notes.md --draft
          gh release upload v3.4.0 Astracct-Linux-* SHA256SUMS.txt linux-packages.json
          gh release edit v3.4.0 --draft=false --latest
