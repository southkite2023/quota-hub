name: quota_hub
description: Quota Hub demo client driven by versioned snapshots.
publish_to: none
version: 3.1.0+21

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  local_auth: ^3.0.2
  tray_manager: 0.5.2
  screen_retriever: 0.2.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  http: ^1.2.0
  crypto: ^3.0.6
  window_manager: 0.5.2
  flutter_secure_storage: 11.2.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/cases.json
    - assets/updater/
    - assets/tray.ico
    - assets/LICENSE.txt
